<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Kelinciku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Tata letak: orang tua = satu kolom selebar ponsel + navigasi bawah; guru/admin = sidebar + konten;
   Open House = pita editorial selebar layar. Satu tampilan terang, sesuai palet merek. */
:root{
  --ivory:#F8F6F0; --paper:#FFFFFF; --sage:#849477; --forest:#344A38; --terra:#C77B5C; --sun:#E8C77A; --ink:#292D29;
  --forest-2:#283A2C; --muted:#636C61; --line:#E4E0D3; --line-strong:#CDC8B8; --wash:#EFECE2;
  --sage-soft:#E8ECE2; --terra-soft:#F6E8E0; --sun-soft:#FAF1D8; --terra-ink:#99523A; --sun-ink:#755710;
  --tile-terra:#B26A4E; --tile-sage:#72836A;
  --font-display:"Plus Jakarta Sans","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(41,45,41,.04);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --bar:46px;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ivory);color:var(--ink);font:400 15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--ink)}
h1,h2,h3,p,figure{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{flex:none;display:block}

/* Tipografi */
.display{font:800 clamp(32px,5.4vw,52px)/1.06 var(--font-display);letter-spacing:-.025em}
.h1{font:700 26px/1.2 var(--font-display);letter-spacing:-.015em}
.h2{font:700 20px/1.25 var(--font-display);letter-spacing:-.01em}
.h3{font:600 16px/1.3 var(--font-display)}
.q{font:700 17px/1.3 var(--font-display)}
.lead{font-size:17px;line-height:1.55}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--terra-ink)}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.link{background:none;border:0;padding:0;color:var(--forest);font:600 13px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.clamp-1,.clamp-2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp-1{-webkit-line-clamp:1} .clamp-2{-webkit-line-clamp:2}
.meta-line{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meta-line span+span::before{content:"·";margin-right:10px}

/* Susunan */
.stack,.stack-s,.stack-xs{display:flex;flex-direction:column;min-width:0}
.stack{gap:18px} .stack-s{gap:10px} .stack-xs{gap:6px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.cols-form{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.pad{padding:12px 18px;margin:0}
.pad .ico{display:inline-block;vertical-align:-3px;margin-right:4px}

/* Bilah demo */
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:#fff}
.demo-in{height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:var(--gl);padding-right:var(--gr)}
.brand{display:inline-flex;align-items:center;gap:9px;flex:none}
.logo{flex:none;display:block}
.brand strong{font:700 16px var(--font-display);letter-spacing:-.01em}
.demo-tag{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:1px 8px;color:rgba(255,255,255,.78)}
.demo-right{position:relative;display:flex;align-items:center;gap:8px}
.dev-toggle{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.12)}
.dev-toggle button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:0;border-radius:6px;background:none;color:rgba(255,255,255,.78);font:600 12.5px var(--font-body);cursor:pointer}
.dev-toggle button.on{background:var(--ivory);color:var(--ink)}
.stage.on{background:var(--wash)}
.as-phone{width:min(390px,100%);min-height:calc(100dvh - var(--bar));margin:0 auto;background:var(--ivory);box-shadow:0 0 0 1px var(--line),0 0 40px rgba(41,45,41,.08)}
.as-phone .display{font-size:32px}
.acct-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:7px 10px;font:600 13px var(--font-body);cursor:pointer}
.acct-name{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-back{position:fixed;inset:0;z-index:41}
.acct-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:42;width:min(320px,calc(100vw - 32px));max-height:calc(100dvh - 72px);overflow-y:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(41,45,41,.2);padding:8px}
.menu-note{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);padding:6px 8px 10px}
.menu-note .ico{margin-top:2px}
.menu-group{border-top:1px solid var(--line);padding:6px 0}
.menu-label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px 4px}
.menu-group>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px;color:inherit;font-size:14px;cursor:pointer}
.menu-group>button:hover,.menu-group>button.on{background:var(--sage-soft)}
.menu-group>button span{display:flex;flex-direction:column}
.menu-group>button strong{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.menu-group>button i{font-style:normal;font-size:12px;color:var(--muted)}
.menu-confirm{display:flex;flex-direction:column;gap:8px;padding:8px;font-size:13px}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font:600 14px var(--font-body);cursor:pointer;white-space:nowrap;text-align:center}
.btn-primary{background:var(--forest);color:#fff} .btn-primary:hover{background:var(--forest-2)}
.btn-ghost{background:var(--paper);border-color:var(--line-strong);color:var(--ink)} .btn-ghost:hover{border-color:var(--sage)}
.btn-quiet{background:transparent;color:var(--forest)} .btn-quiet:hover{background:var(--sage-soft)}
.btn-danger{background:var(--terra-ink);color:#fff}
.btn-light{background:var(--ivory);color:var(--forest)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-block{width:100%;white-space:normal}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;flex:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra-ink);color:#fff;font:700 11px/18px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.badge.inline{position:static;display:inline-block}

/* Kartu, daftar */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-title{font:600 15px/1.3 var(--font-display);padding:14px 18px;border-bottom:1px solid var(--line)}
.card-title.plain{padding:0;border:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;min-width:0}
.row-btn{width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
.row-btn:hover{background:var(--ivory)}
.card.row{padding:14px 16px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-main strong{font-weight:600}
.row-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.row-ico{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--sage-soft);color:var(--forest)}
.row-ico.warn,.row-ico.sun{background:var(--sun-soft);color:var(--sun-ink)}
.row-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:46%}
.row-actions{display:flex;gap:4px;flex:none}
.notif .dot{width:8px;height:8px;flex:none;border-radius:50%;background:transparent}
.notif.unread .dot{background:var(--terra)}
.notif:not(.unread) strong{font-weight:500}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 18px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}
.empty strong{color:var(--ink)}

/* Pil, tag, avatar */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--wash);color:var(--muted)}
.pill-ok{background:var(--sage-soft);color:var(--forest)}
.pill-warn,.pill-sun{background:var(--sun-soft);color:var(--sun-ink)}
.pill-bad{background:var(--terra-soft);color:var(--terra-ink)}
.pill-info{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.row-main .tags .pill{white-space:normal;border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--sage-soft);color:var(--forest)}
.avatar{display:inline-grid;place-items:center;flex:none;border-radius:50%;font-weight:700;font-family:var(--font-display);background:var(--sage-soft);color:var(--forest)}
.av-terra{background:var(--terra-soft);color:var(--terra-ink)}

/* Formulir */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13px;font-weight:600}
.input{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4}
textarea.input{resize:vertical}
.input:focus{outline:2px solid var(--sage);outline-offset:1px;border-color:var(--sage)}
.input-sm{padding:6px 10px;font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:7px 13px;font:500 13px var(--font-body);color:var(--ink);cursor:pointer}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.chip-n{margin-left:6px;opacity:.7;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--wash);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 12px;font:600 13px var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(41,45,41,.12)}
.seg-sm{display:inline-flex} .seg-sm button{padding:5px 10px;font-size:12px}
.seg-att{display:inline-flex;flex:none}
.seg-att button.on-ok{background:var(--forest);color:#fff}
.seg-att button.on-warn{background:var(--sun);color:var(--ink)}
.seg-att button.on-bad{background:var(--terra-ink);color:#fff}
.switch{position:relative;width:46px;height:28px;flex:none;border:0;border-radius:999px;background:var(--line-strong);cursor:pointer;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--forest)} .switch.on i{transform:translateX(18px)}
.callout{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:10px;background:var(--sage-soft);font-size:13.5px}
.callout .ico{margin-top:2px}
.callout.warn{background:var(--sun-soft)} .callout.bad{background:var(--terra-soft);color:var(--terra-ink)}
.inline-add{display:flex;gap:8px;margin-top:4px} .inline-add .input{flex:1;min-width:0}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.notes-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.notes-box summary{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.notes-box[open] summary{margin-bottom:8px} .notes-box .hint{margin-bottom:10px}
.photo-input{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.photo-input-side{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.toolbar{display:flex;flex-direction:column;gap:10px;min-width:0}
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}

/* Ubin gambar bermotif batik */
.tile{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:10px;background:var(--forest)}
.tile.tone-terra{background:var(--tile-terra)} .tile.tone-sage{background:var(--tile-sage)}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile-motif{position:absolute;inset:0;display:block}
.tile-tag{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(41,45,41,.6);color:#fff;font-size:11px}
.thumb{width:44px;flex:none;border-radius:8px}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo-grid.small{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.photo-grid figcaption{font-size:12px;color:var(--muted);margin-top:4px}

/* Isi: kegiatan, laporan, pengumuman */
.act-card{padding:0;overflow:hidden}
.act-card-btn{display:block;width:100%;padding:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.act-card .tile{border-radius:0}
.act-card-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.deflist{display:flex;flex-direction:column;margin:0}
.deflist>div{padding:12px 0;border-top:1px solid var(--line)}
.deflist dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.deflist dd{margin:4px 0 0}
.deflist.tight{padding:4px 18px}
.deflist.tight>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0}
.deflist.tight>div:first-child{border-top:0}
.deflist.tight dt{flex:none;padding-top:2px} .deflist.tight dd{margin:0;text-align:right}
.note{margin:0;padding:14px 16px;border-radius:10px;background:var(--sun-soft)}
.note footer{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticks li{display:flex;gap:8px;align-items:flex-start}
.ticks .ico{margin-top:3px;color:var(--sage)}
.ticks.card{padding:14px 18px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.report section{display:flex;flex-direction:column;gap:8px}
.event-box{display:grid;gap:10px;margin:0;padding:14px 16px;border-radius:10px;background:var(--sage-soft)}
.event-box>div{display:flex;gap:12px}
.event-box dt{display:inline-flex;align-items:center;gap:6px;min-width:96px;font-size:13px;font-weight:600;color:var(--forest)}
.event-box dd{margin:0}
.date-box{width:44px;height:48px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--terra-soft);color:var(--terra-ink)}
.date-box b{font:700 17px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.date-box i{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* Kehadiran */
.ad{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.ad-hadir{background:var(--forest)} .ad-terlambat{background:var(--sun);box-shadow:inset 0 0 0 1.5px var(--sun-ink)}
.ad-absen{background:var(--terra);border-radius:2px} .ad-none{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.att-dots{display:inline-flex;gap:6px}
.att-row{flex-wrap:wrap}
.att-row .avatar{align-self:flex-start}
.att-row .input{margin-top:6px}
.save-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:var(--ivory)}
.att-5{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.legend .ad{margin:0 2px 0 8px} .legend .ad:first-child{margin-left:0}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend-row .ad{margin-right:4px}
.att-bar{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--wash)}
.att-bar i{display:block;flex-basis:0}
.ab-hadir{background:var(--forest)} .ab-terlambat{background:var(--sun)} .ab-absen{background:var(--terra)} .ab-kosong{background:var(--line-strong)}
.att-bar.empty{height:auto;background:none;border:1px dashed var(--line-strong);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.progress{height:8px;border-radius:999px;background:var(--wash);overflow:hidden}
.progress i{display:block;height:100%;background:var(--forest);border-radius:999px;transition:width .3s}

/* Percakapan */
.thread{display:flex;flex-direction:column;gap:12px;min-width:0}
.thread-msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 2px}
.thread-day{align-self:center;margin:6px 0;padding:2px 10px;border-radius:999px;background:var(--wash);font-size:12px;color:var(--muted)}
.bubble{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;overflow-wrap:anywhere}
.bubble span{display:block;margin-top:2px;font-size:11px;opacity:.7;text-align:right}
.bubble.mine{align-self:flex-end;background:var(--forest);color:#fff;border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px} .composer .input{flex:1;min-width:0}

/* Modal, toast */
.modal-back{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(41,45,41,.45)}
.modal{display:flex;flex-direction:column;width:min(520px,100%);max-height:min(86dvh,760px);overflow:hidden;border-radius:14px;background:var(--ivory);box-shadow:0 20px 50px rgba(41,45,41,.25)}
.modal-wide{width:min(680px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px 12px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.modal-body{padding:18px;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(520px,calc(100vw - 32px));padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(41,45,41,.3)}
